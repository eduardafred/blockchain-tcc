global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'besu-nodes'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:9545'
          - 'host.docker.internal:9546'
          - 'host.docker.internal:9547'
          - 'host.docker.internal:9548'
          - 'host.docker.internal:9549'